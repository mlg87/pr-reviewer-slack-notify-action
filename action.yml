name: "PR Reviewer Slack Notify Action"
description: "Blow up a channel with @s when adding people to review your PR."
branding:
  color: blue
  icon: at-sign
inputs:
  aws-region:
    description: 'Region in which the Github <=> Slack engineer mapping JSON is stored'
    required: true
  aws-s3-bucket:
    description: 'Bucket in which the Github <=> Slack engineer mapping JSON object is stored in S3'
    required: true
  aws-s3-object-key:
    description: 'Name of the Github <=> Slack engineer mapping JSON object in S3'
    required: true
  base-branch:
    description: "Branch that you will be opening PRs in to (e.g. 'staging', 'master')."
    required: true
  bot-token:
    description: "OAuth token for your Slack App Bot to sign requests to Slack's API with."
    required: true
  channel-id:
    description: "ID of the channel or conversation in Slack you would like messages posted to."
    required: true
  github-token:
    description: "Personal access token with repository rights."
    required: true
  label-name-to-watch-for:
    description: "If you would like to notify the thread of a label being applied to a PR, set this."
    required: false
    default: ""
  label-for-initial-notification:
    description: "The label that triggers initial Slack notifications when applied to the PR."
    required: true
  ignore-draft-prs:
    description: "Do not message on draft PRs"
    required: false
    default: "false"
  silence-on-quiet-label:
    description: "Do not message if the PR has the `quiet` label"
    required: false
    default: "false"
  fail-silently:
    description: "Allow action to fail silently to hide the red X of death"
    required: false
    default: "false"
  verbose:
    description: "If verbose is set to true, the entire PR text is posted to Slack. If false, just the title is posted."
    required: false
    default: "true"
  message-initial:
    description: "Template for the message that opens the Slack thread. Placeholders: {{reviewer_mentions}}, {{author}}, {{pr_url}}, {{pr_title}}, {{pr_number}}. Empty uses the built-in copy."
    required: false
    default: ""
  message-review-approved:
    description: "Template for the thread reply when a review approves the PR. Placeholders: {{author_mention}}, {{reviewer}}, {{author}}, {{pr_url}}, {{pr_title}}, {{pr_number}}. Empty uses the built-in copy."
    required: false
    default: ""
  message-review-changes-requested:
    description: "Template for the thread reply when a review requests changes. Placeholders: same as message-review-approved. Empty uses the built-in copy."
    required: false
    default: ""
  message-review-commented:
    description: "Template for the thread reply when a review leaves exactly one comment. Placeholders: those of message-review-approved plus {{comment_count}}. Empty uses the built-in copy."
    required: false
    default: ""
  message-review-commented-plural:
    description: "Template for the thread reply when a review leaves any other number of comments. Placeholders: those of message-review-approved plus {{comment_count}}. Empty uses the built-in copy."
    required: false
    default: ""
  message-review-comment-line:
    description: "Template for each quoted comment under a commented review. Placeholders: {{comment_url}}, {{comment_body}}, plus those of message-review-approved. Empty uses the built-in copy."
    required: false
    default: ""
  message-new-commits:
    description: "Template for the thread reply when new commits are pushed. Placeholders: {{reviewer_mentions}}, {{author}}, {{pr_url}}, {{pr_title}}, {{pr_number}}. Empty uses the built-in copy."
    required: false
    default: ""
  message-new-commits-diff-link:
    description: "Template appended after a space to message-new-commits when the push has a compare URL. Placeholders: {{compare_url}}, plus those of message-new-commits. Empty uses the built-in copy."
    required: false
    default: ""
  message-label-added:
    description: "Template for the thread reply when label-name-to-watch-for is applied. Placeholders: {{author_mention}}, {{labeler}}, {{label}}, {{author}}, {{pr_url}}, {{pr_title}}, {{pr_number}}. Empty uses the built-in copy."
    required: false
    default: ""
  message-merged:
    description: "Template for the thread reply when the PR is merged. Placeholders: {{author}}, {{pr_url}}, {{pr_title}}, {{pr_number}}. Empty uses the built-in copy."
    required: false
    default: ""
  reaction-review-approved:
    description: "Slack emoji name, with or without colons, added to the thread when a review approves. Empty uses white_check_mark."
    required: false
    default: ""
  reaction-review-changes-requested:
    description: "Slack emoji name, with or without colons, added to the thread when a review requests changes. Empty uses octagonal_sign."
    required: false
    default: ""
  reaction-review-commented:
    description: "Slack emoji name, with or without colons, added to the thread when a review comments. Empty uses speech_balloon."
    required: false
    default: ""
  reaction-label-added:
    description: "Slack emoji name, with or without colons, added to the thread when label-name-to-watch-for is applied. Empty uses heart_eyes."
    required: false
    default: ""
  reaction-merged:
    description: "Slack emoji name, with or without colons, added to the thread when the PR is merged. Empty uses ship-it."
    required: false
    default: ""
runs:
  using: "node24"
  main: "dist/index.js"
